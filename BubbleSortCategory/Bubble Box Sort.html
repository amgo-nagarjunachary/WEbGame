<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Box Sort</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;color:#2f4a2a;display:flex;justify-content:center;user-select:none;overflow-x:hidden;
background:#5fae43}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
background:radial-gradient(circle at 15% 20%,#74c150,transparent 40%),radial-gradient(circle at 85% 60%,#4f9d3b,transparent 45%),repeating-radial-gradient(circle at 30% 70%,#63b146 0 14px,#5aa840 14px 28px)}
.bg i{position:absolute;display:block;border-radius:50%}
.tree{background:radial-gradient(circle at 40% 35%,#5fae4a,#2f7d33 60%,#1f5f2a);box-shadow:4px 6px 0 #1f5f2a55}
.bush{background:radial-gradient(circle at 40% 35%,#6fbe55,#3c8c35);box-shadow:3px 4px 0 #1f5f2a44}
.fl{width:7px;height:7px;background:#fff;box-shadow:0 0 0 2px #ffe27a}
.stone{border-radius:10px!important;background:#c9c0a8;box-shadow:inset 0 -3px 0 #a79e88}
.pond{background:radial-gradient(circle at 40% 40%,#2e9ad6,#1b78b8);border:6px solid #8d9a7a}
.pad{background:#3f9e46;width:26px;height:20px}
.lamp{width:26px;height:26px;background:radial-gradient(circle,#4b5b7a,#26304a);border:3px solid #1c2338}
.bench{border-radius:4px!important;background:repeating-linear-gradient(90deg,#8a5a34 0 14px,#6b4326 14px 16px)}
.game{position:relative;z-index:1;width:100%;max-width:440px;padding:10px 12px 18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800;color:#fff;text-shadow:0 2px 0 #1f5f2a}
.top button{font:inherit;font-weight:800;background:#fffaf0;border:2px solid #a8d08d;border-radius:10px;padding:0 12px;cursor:pointer;color:#2f4a2a}
.shelf{background:linear-gradient(#a06a3c,#7f522c);border-radius:12px;padding:6px 8px 14px;display:flex;justify-content:center;gap:34px;box-shadow:0 6px 0 #5c3a1d,0 10px 12px #0003}
.box{width:40%;height:128px;position:relative;transition:transform .45s,opacity .45s;margin-top:-18px}
.box .body{position:absolute;inset:0;clip-path:polygon(0 8%,12% 0,88% 0,100% 8%,100% 100%,0 100%);background:linear-gradient(90deg,#c9a272,#dcb98a 45%,#c49a68);}
.box .mouth{position:absolute;left:3%;right:3%;top:0;height:34%;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);background:linear-gradient(#8f6b43,#b08857)}
.box .rim{position:absolute;left:0;right:0;bottom:0;height:100%;border-bottom:4px solid #a07a4b}
.box .em{position:absolute;left:50%;top:48%;width:62px;height:62px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:44px;
filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 2px #0004)}
.pips{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.pip{width:13px;height:13px;border-radius:50%;background:#fff7;border:2px solid #8a5a34}.pip.on{background:#ffd23f}
.box.done{transform:scale(.7) translateY(-20px);opacity:0}.box.empty{opacity:.3}
.bump{animation:bump .25s}@keyframes bump{50%{transform:scale(1.1)}}
.bar{display:flex;gap:6px;margin:12px 0}
.moves{background:#fffaf0;border:3px solid #a8d08d;border-radius:12px;padding:2px 10px;text-align:center;line-height:1;min-width:66px;box-shadow:0 3px 0 #0003}
.moves small{font-size:15px;font-weight:800;display:block;padding-top:5px}.moves b{font-size:30px}
.slots{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#3b7d4a;border-radius:10px;padding:4px;border:2px solid #8dbd8f}
.slot{aspect-ratio:1;background:#2f6b3a;border:2px solid #7aab7d;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6.3vw,29px)}
.slot span{animation:pop .22s}@keyframes pop{from{transform:scale(0)}}
.board{position:relative;width:100%;touch-action:manipulation}
.bub{position:absolute;left:0;top:0;border-radius:50%;will-change:transform;
background:radial-gradient(circle at 50% 55%,#ffffff12 55%,#bfeaff55 82%,#ffffffbb 100%);
border:2px solid #ffffffb0;box-shadow:inset 0 -8px 16px #7fd0ff55,inset 0 6px 14px #fff9,0 6px 10px #0003}
.bub::before{content:"";position:absolute;left:18%;top:8%;width:34%;height:14%;border-radius:50%;background:#fffc;transform:rotate(-28deg);filter:blur(1px)}
.cell{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:17%}
.it{font-size:calc(var(--r)*.62);line-height:1;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 3px 2px #0004)}
.it.x{visibility:hidden;pointer-events:none}
.fly{position:fixed;z-index:20;pointer-events:none;line-height:1;filter:drop-shadow(0 6px 4px #0004)}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #9fdcff;pointer-events:none}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30}
.ov.show{display:flex}
.card{background:#fffaf0;border-radius:20px;padding:26px 30px;text-align:center;max-width:300px;box-shadow:0 8px 0 #a8d08d}
.card h2{margin:0 0 6px;font-size:30px}.card p{margin:0 0 16px}
button.go{font:inherit;font-weight:800;font-size:18px;background:#ffb703;border:0;border-bottom:4px solid #c98a00;border-radius:12px;padding:10px 24px;cursor:pointer;color:#3a2a00}
html,body{height:100%}body{display:block;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a6b36,#0f2e18)}
.stage{position:absolute;left:50%;top:50%;width:450px;height:800px;transform-origin:center;overflow:hidden;border-radius:18px;background:#5fae43;box-shadow:0 0 40px #0008}
.bg{position:absolute}.game{position:absolute;inset:0;max-width:none;display:flex;flex-direction:column;padding:12px 14px 16px}
.board{flex:1;min-height:0;overflow:hidden}.ov{position:absolute}.fly{position:absolute}
.shelf{display:block;position:relative;height:166px;padding:0;gap:0;margin-top:4px;background:none;box-shadow:none;border-radius:0;overflow:hidden}
.rail{position:absolute;left:0;right:0;top:0;height:12px;border-radius:6px;background:linear-gradient(#6b7382,#3f4655);border-bottom:3px solid #262b36;z-index:3}
.trol{position:absolute;left:-19px;top:-2px;width:38px;height:18px;border-radius:5px;background:#f0b429;border:2px solid #7a5a00;z-index:4}
.hook{position:absolute;left:0;top:22px;width:0;height:0;z-index:2}
.cable{position:absolute;left:-2px;bottom:0;width:4px;height:300px;background:linear-gradient(90deg,#222,#666)}
.claw{position:absolute;left:-17px;top:-2px;width:34px;height:15px;background:#f0b429;border:2px solid #7a5a00;border-radius:4px 4px 2px 2px}
.claw::before,.claw::after{content:"";position:absolute;bottom:-10px;width:6px;height:12px;background:#7a5a00;border-radius:0 0 3px 3px;transition:transform .15s}
.claw::before{left:1px}.claw::after{right:1px}.claw.open::before{transform:translateX(-5px)}.claw.open::after{transform:translateX(5px)}
.belt{position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:13px;background:repeating-linear-gradient(90deg,#4a505c 0 12px,#363b46 12px 24px);border:3px solid #1f232b;box-shadow:0 4px 0 #0006;animation:belt 1.2s linear infinite}
@keyframes belt{to{background-position:24px 0}}
.boxrow{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 4px;z-index:1}
.bx{position:relative;width:92px;height:88px}
.bx[style*="z-index: 6"] .box{filter:drop-shadow(0 10px 5px #0005)}
.box{position:absolute;inset:0;width:auto;height:auto;margin:0;transition:none}
.box .glass{position:absolute;inset:0;border:3px solid #b98e5a;border-bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(160deg,#ffffff70,#ffe8c433 60%,#ffffff33);box-shadow:inset 0 0 14px #fff6;z-index:1}
.box .cells{position:absolute;left:6px;right:6px;top:10px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;z-index:2}
.box .c{font-size:30px;line-height:1;opacity:.3;filter:grayscale(1)}.box .c:first-child{grid-column:1/3}
.box .c.on{opacity:1;filter:drop-shadow(0 2px 1px #0004);animation:pop .22s}
.box .rimf{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(#d9b183,#c39a6a);border:3px solid #a67c4e;border-radius:0 0 10px 10px;z-index:3}
.box .cover{position:absolute;inset:0;background:linear-gradient(90deg,#c9a272,#dcb98a 45%,#c49a68);border:3px solid #a67c4e;border-radius:6px 6px 10px 10px;opacity:0;transition:opacity .3s;z-index:4}
.box .cover::after{content:"";position:absolute;left:42%;width:16%;top:0;bottom:0;background:#efe3c8cc}
.box .f1,.box .f2{position:absolute;top:-6px;width:50%;height:13px;background:#dcb98a;border:2px solid #a67c4e;transition:transform .3s}
.box .f1{left:0;transform-origin:0 100%;transform:rotate(-50deg);border-radius:4px 0 0 0}
.box .f2{right:0;transform-origin:100% 100%;transform:rotate(50deg);border-radius:0 4px 0 0}
.box.closed .cover{opacity:1}.box.closed .f1,.box.closed .f2{transform:rotate(0);z-index:5}
.shelf{overflow:visible}.rail,.trol{display:none}.cable{height:900px}
.box .tag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);z-index:6;background:#fffaf0;border:2px solid #a67c4e;border-radius:8px;font-size:12px;font-weight:800;line-height:1.25;padding:0 8px;white-space:nowrap;box-shadow:0 2px 0 #0003;color:#5a3c1e}
.box .lock{position:absolute;inset:0;z-index:7;background:#2b2f37d9;border-radius:8px 8px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.box .lock span{font-size:26px;line-height:1}
.rv{font:inherit;font-weight:800;font-size:12px;background:#ffb703;border:0;border-bottom:3px solid #c98a00;border-radius:8px;padding:2px 8px;cursor:pointer;color:#3a2a00}
@media (prefers-reduced-motion:reduce){.box,.slot span{transition:none;animation:none}}
</style></head><body>
<div class="stage" id="stage"><div class="bg" id="bg"></div>
<div class="game">
  <div class="top"><span id="left"></span><button id="re">Restart</button></div>
  <div class="shelf" id="crane"><div class="rail"></div><div class="trol" id="trol"></div><div class="hook" id="hook"><div class="cable"></div><div class="claw open" id="claw"></div></div><div class="boxrow" id="boxrow"></div><div class="belt"></div></div>
  <div class="bar"><div class="moves"><small>Moves</small><b id="mv">0</b></div><div class="slots" id="slots"></div></div>
  <div class="board" id="board"></div>
</div>
<div class="ov" id="rvov"><div class="card"><h2>Rewarded video</h2><p id="rvt"></p></div></div><div class="ov" id="ov"><div class="card"><h2 id="ot"></h2><p id="om"></p><button class="go" id="again">Play again</button></div></div></div>
<script>
const POOL=["🐶","🐱","🐰","🐥","🐢","🐼","🐧","🐸","🐮","🐷","🍕","🍔","🌭","🍩","🍰","🍦","🌮","🍟","🚗","🚕","🚓","🚌","🚙","🚚","⚽","🎧","☕","🎒","🛋️","🪴","💡","⏰","💻","📱","🎮"];
const NB=15,ON=9,PER=4,NEED=3,SLOTN=6,$=id=>document.getElementById(id);
let adBusy=false,jobs=[],craneBusy=false,gid=0,SW,cx=0,cy=0,reserve,B,slots,targets,queue,moves,lock,over,pendS,W,H,R,raf;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// decorative park background
(function(){const bg=$("bg");const add=(c,x,y,w,h,extra="")=>bg.insertAdjacentHTML("beforeend",`<i class="${c}" style="left:${x}%;top:${y}%;width:${w}px;height:${h||w}px;${extra}"></i>`);
[[-6,-2,150],[78,-3,130],[-8,34,110],[90,40,100],[-6,68,120],[82,78,170],[44,92,150]].forEach(a=>add("tree",...a));
[[8,12,46],[88,22,44],[2,52,50],[92,60,52],[70,92,60],[22,90,50]].forEach(a=>add("bush",...a));
[[10,30],[25,48],[75,35],[60,62],[15,75],[88,88],[40,70],[55,20]].forEach(a=>add("fl",a[0],a[1],7));
add("pond",-12,86,170,110);add("pad",6,92,26,20);add("pad",16,96,22,17);
for(let i=0;i<7;i++)add("stone",74+i*3-(i%2)*2,50+i*6.4,46,26,`transform:rotate(${-20+i*4}deg)`);
add("lamp",-1,34,26);add("lamp",95,86,26);add("bench",55,0,110,26,"transform:rotate(18deg)")})();

function init(){
  cancelAnimationFrame(raf);
  const seq=[];for(let r=0;r<NB*PER/NEED/4;r++)seq.push(...shuffle(Object.keys(CT)));
  const items=shuffle(seq.flatMap(pick));
  queue=seq.slice();
  targets=[0,1,2,3].map((_,i)=>i<2?{cat:queue.shift(),it:[],n:0,p:0}:{cat:null,it:[],n:0,p:0,locked:true});
  slots=[];pendS=0;moves=0;lock=false;over=false;jobs=[];craneBusy=false;gid++;
  $("boxrow").innerHTML="<div class='bx'></div>".repeat(4);SW=$("crane").clientWidth;cx=SW/2;cy=PARK;
  $("trol").style.transform=`translateX(${cx}px)`;$("hook").style.transform=`translate(${cx}px,${PARK}px)`;$("claw").classList.add("open");
  $("ov").classList.remove("show");
  const bd=$("board");bd.innerHTML="";
  W=bd.clientWidth;H=bd.clientHeight;R=Math.min(W/5.5,H/6.3);bd.style.setProperty("--r",R+"px");
  B=[];
  reserve=[];for(let i=0;i<NB;i++)reserve.push(items.slice(i*PER,i*PER+PER));for(let i=0;i<ON;i++){
    const el=document.createElement("div");el.className="bub";el.style.width=el.style.height=R*2+"px";
    const set=reserve.shift();
    el.innerHTML=`<div class="cell">${set.map((e,k)=>`<button class="it" data-b="${i}" data-i="${k}">${e}</button>`).join("")}</div>`;
    bd.appendChild(el);
    B.push({el,items:set,x:R+Math.random()*(W-2*R),y:-R-i*R*1.1,vx:(Math.random()-.5)*3,vy:0,alive:true});
  }
  pull();render();last=performance.now();loop();
}
let last=0;
function loop(t=performance.now()){
  const dt=1;last=t;
  const live=B.filter(b=>b.alive);
  live.forEach(b=>{b.hit=0;b.vy+=.5*dt;b.vx*=.99;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.5}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)*.5}
    if(b.y>H-R){b.y=H-R;b.vy=Math.abs(b.vy)<2.5?0:-Math.abs(b.vy)*.25;b.vx*=.9;b.hit=1}});
  for(let it=0;it<8;it++)for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const a=live[i],c=live[j];let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||.01;
    if(d<2*R){const o=(2*R-d)/2,nx=dx/d,ny=dy/d;
      a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;
      const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
      a.hit=c.hit=1;if(rv<0){const k=-rv*(rv<-3?.6:.5);a.vx-=nx*k;a.vy-=ny*k;c.vx+=nx*k;c.vy+=ny*k}
      // slide off each other
      }}
  live.forEach(b=>{if(b.hit&&Math.hypot(b.vx,b.vy)<1.3){b.vx=0;b.vy=0}b.el.style.transform=`translate(${b.x-R}px,${b.y-R}px)`});
  raf=requestAnimationFrame(loop);
}
function pull(){targets.forEach(t=>{if(!t||t.locked)return;
  for(let i=slots.length-1;i>=0&&t.n+t.p<NEED;i--)if(catOf(slots[i])===t.cat){t.it.push(slots[i]);slots.splice(i,1);t.n++}})}

function fly(src,e,dest,cb){
  const a=src.getBoundingClientRect(),d=dest.getBoundingClientRect(),fs=parseFloat(getComputedStyle(src).fontSize),sr=$("stage").getBoundingClientRect(),K=sr.width/450;
  const f=document.createElement("div");f.className="fly";f.textContent=e;f.style.fontSize=fs+"px";
  const sx=(a.left+a.width/2-sr.left)/K,sy=(a.top+a.height/2-sr.top)/K,dx=(d.left+d.width/2-a.left-a.width/2)/K,dy=(d.top+d.height/2-a.top-a.height/2)/K;
  f.style.left=sx+"px";f.style.top=sy+"px";$("stage").appendChild(f);
  const tr=(x,y,s)=>`translate(-50%,-50%) translate(${x}px,${y}px) scale(${s})`;
  const an=f.animate([{transform:tr(0,0,1)},{transform:tr(dx*.45,dy*.45-50,1.5),offset:.4},{transform:tr(dx,dy,Math.min(1,d.width/K/fs*.9))}],{duration:480,easing:"cubic-bezier(.4,0,.6,1)"});
  an.onfinish=()=>{f.remove();cb()};
}
function tap(btn){
  if(lock||over)return;const b=+btn.dataset.b,i=+btn.dataset.i,bb=B[b],e=bb.items[i];if(!e)return;
  const ti=targets.findIndex(t=>t&&!t.locked&&t.cat===catOf(e)&&t.n+t.p<NEED);
  let dest;
  if(ti>=0){const t0=targets[ti];dest=$("boxrow").children[ti].querySelectorAll(".c")[t0.n+t0.p]}
  else{if(slots.length+pendS>=SLOTN){bump($("slots"));return}dest=$("slots").children[slots.length+pendS]}
  bb.items[i]=null;btn.classList.add("x");moves++;$("mv").textContent=moves;
  bb.vy-=1.5;bb.vx+=(Math.random()-.5)*1.5; // nudge the ball
  if(ti>=0){const t=targets[ti];t.p++;
    fly(btn,e,dest,()=>{t.p--;t.n++;t.it.push(e);render(ti);settle()})}
  else{pendS++;
    fly(btn,e,dest,()=>{pendS--;slots.push(e);pull();render();settle()})}
  if(bb.items.every(x=>!x))popBubble(bb);
}
function spawnNext(){if(!reserve.length||over)return;const i=B.length,set=reserve.shift(),el=document.createElement("div");
  el.className="bub";el.style.width=el.style.height=R*2+"px";
  el.innerHTML=`<div class="cell">${set.map((e,k)=>`<button class="it" data-b="${i}" data-i="${k}">${e}</button>`).join("")}</div>`;
  $("board").appendChild(el);B.push({el,items:set,x:R+Math.random()*(W-2*R),y:-R*1.3,vx:(Math.random()-.5)*2,vy:2,alive:true})}
const PARK=-260;
const CATS={Animals:"🐶🐱🐰🐥🐢🐼🐧🐸🐮🐷",Food:"🍕🍔🌭🍩🍰🍦🌮🍟",Cars:"🚗🚕🚓🚌🚙🚚",Objects:"⚽🎧☕🎒🛋️🪴💡⏰",Gadgets:"💻📱🎮"};
const CT={Animals:["🐶","🐱","🐰","🐥","🐢","🐼","🐧","🐸","🐮","🐷"],Food:["🍕","🍔","🌭","🍩","🍰","🍦","🌮","🍟"],Cars:["🚗","🚕","🚓","🚌","🚙","🚚"],Objects:["💻","📱","🎮","🎧","⌚","📷","🎒","💡","⏰","🛋️","🪴","☕","⚽"]};
const ICON={Animals:"🐾",Food:"🍴",Cars:"🏁",Objects:"📦"};
const pick=c=>shuffle(CT[c].slice()).slice(0,3);
const catOf=e=>Object.keys(CT).find(k=>CT[k].includes(e));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mv=(el,a,b,ms)=>{const an=el.animate([{transform:a},{transform:b}],{duration:ms,easing:"ease-in-out"});el.style.transform=b;return an.finished.catch(()=>{})};
function crane(x0,y0,x1,y1,ms){cx=x1;cy=y1;return Promise.all([mv($("trol"),`translateX(${x0}px)`,`translateX(${x1}px)`,ms),mv($("hook"),`translate(${x0}px,${y0}px)`,`translate(${x1}px,${y1}px)`,ms)])}
function boxHTML(t){return `<div class="box"><i class="f1"></i><i class="f2"></i><div class="glass"></div><div class="cells">${[0,1,2].map(k=>k<t.it.length?`<span class="c on">${t.it[k]}</span>`:`<span class="c">${ICON[t.cat]||""}</span>`).join("")}</div><div class="rimf"></div><div class="cover"></div>${t.locked?"":`<div class="tag">${t.cat}</div>`}${t.locked?`<div class="lock"><span>🔒</span><small style="font-weight:800;font-size:11px;color:#fff">Extra box</small><button class="rv">▶ Unlock</button></div>`:""}</div>`}
function renderBoxes(bi){const rows=$("boxrow").children;
  targets.forEach((t,i)=>{const w=rows[i];if(!w||w._busy)return;
    if(w._t!==t||w._l!==!!(t&&t.locked)){w._t=t;w._l=!!(t&&t.locked);w.innerHTML=t?boxHTML(t):""}
    else if(t){w.querySelectorAll(".c").forEach((c,k)=>{const on=k<t.it.length;c.classList.toggle("on",on);c.textContent=on?t.it[k]:ICON[t.cat]||""})}
    if(i===bi&&t){const b=w.firstChild;b.classList.add("bump");setTimeout(()=>b.classList.remove("bump"),250)}})}
async function runCrane(){
  const g=gid,claw=$("claw");craneBusy=true;const S=async p=>{await p;if(g!==gid)throw 0};
  try{while(jobs.length){
    const i=jobs.shift(),w=$("boxrow").children[i],box=w.firstChild,x=w.offsetLeft+w.offsetWidth/2,out=SW+90,UP=`translate(0px,${PARK-30}px) scale(1.12)`,L="translate(0px,-24px) scale(1.12)",D="translate(0px,0px) scale(1)";
    w._busy=true;w.style.zIndex=6;box.classList.add("closed");
    await S(sleep(320));
    await S(crane(x,PARK,x,PARK,1));
    claw.classList.add("open");await S(crane(x,PARK,x,30,650));claw.classList.remove("open");await S(sleep(140));
    await S(Promise.all([mv(box,D,UP,800),crane(x,30,x,PARK,800)]));
    
    targets[i]=null;w._t=null;w.innerHTML="";
    const nt=queue.length?{cat:queue.shift(),it:[],n:0,p:0}:null;
    if(nt){w.innerHTML=boxHTML(nt);const nb=w.firstChild,A=UP;nb.style.transform=A;
      
      await S(Promise.all([mv(nb,A,D,800),crane(x,PARK,x,30,800)]));
      claw.classList.add("open");await S(sleep(160));await S(crane(x,30,x,PARK,650));nb.style.transform="";
    }
    targets[i]=nt;w._t=nt;w._busy=false;w.style.zIndex="";pull();render();
  }}catch(e){return}
  craneBusy=false;settle();
}
function bump(el){el.classList.add("bump");setTimeout(()=>el.classList.remove("bump"),250)}
function popBubble(bb){bb.alive=false;const bd=$("board");spawnNext();
  setTimeout(()=>{
    for(let k=0;k<10;k++){const s=document.createElement("i");s.className="spark";s.style.left=bb.x-4+"px";s.style.top=bb.y-4+"px";bd.appendChild(s);
      const ang=k/10*6.28,r=R*(1.0+Math.random()*.4);
      s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(ang)*r}px,${Math.sin(ang)*r}px) scale(.2)`,opacity:0}],{duration:420,easing:"ease-out"}).onfinish=()=>s.remove()}
    bb.el.animate([{transform:bb.el.style.transform+" scale(1)",opacity:1},{transform:bb.el.style.transform+" scale(1.25)",opacity:.8,offset:.4},{transform:bb.el.style.transform+" scale(1.4)",opacity:0}],{duration:260,fill:"forwards"}).onfinish=()=>bb.el.remove();
  },450); // after the last item has flown out
}
function settle(){
  if(over||lock)return;
  targets.forEach((t,i)=>{if(t&&t.n>=NEED&&!t.done){t.done=true;jobs.push(i);const bx=$("boxrow").children[i].firstChild;bx&&bx.classList.add("closed")}});
  if(jobs.length&&!craneBusy)runCrane();
  if(0){
    lock=true;render();
    setTimeout(()=>{targets=targets.map(t=>t&&t.n>=NEED?(queue.length?{e:queue.shift(),n:0,p:0}:null):t);
      pull();lock=false;render();settle()},560);return}
  if(jobs.length||craneBusy)return;if(targets.every(t=>!t||t.locked))return end(true);
  if(slots.length>=SLOTN&&pendS===0&&!targets.some(t=>t&&t.p>0)){
    const rest=B.flatMap(b=>b.items).filter(Boolean);
    if(!rest.some(e=>targets.some(t=>t&&t.n<NEED&&t.cat===catOf(e))))end(false)}
}
function end(w){over=true;setTimeout(()=>{
  $("ot").textContent=w?"All sorted!":"Slots are full";
  $("om").textContent=w?`Cleared in ${moves} moves.`:"No item left fits a box. Try a different order.";
  $("ov").classList.add("show")},500)}
function render(bumpI=-1){renderBoxes(bumpI);
  $("mv").textContent=moves;
  $("left").textContent=`Boxes left: ${queue.length+targets.filter(t=>t&&!t.locked).length}`;
  void targets.map((t,i)=>t?`<div class="box ${t.n>=NEED?"done":""} ${i===bumpI?"bump":""}"><div class="body"></div><div class="mouth"></div><div class="em">${t.e}</div><div class="pips">${[0,1,2].map(k=>`<i class="pip ${k<t.n?"on":""}"></i>`).join("")}</div></div>`:`<div class="box empty"><div class="body"></div></div>`).join("");
  $("slots").innerHTML=Array.from({length:SLOTN},(_,i)=>`<div class="slot">${slots[i]?`<span>${slots[i]}</span>`:""}</div>`).join("");
}
function watchAd(i){const t=targets[i];if(!t||!t.locked||adBusy)return;if(!queue.length){targets[i]=null;render();settle();return}adBusy=true;const o=$("rvov"),p=$("rvt");let s=3;o.classList.add("show");p.textContent=`Demo ad playing… ${s}s`;
  const iv=setInterval(()=>{s--;if(s>0)p.textContent=`Demo ad playing… ${s}s`;else{clearInterval(iv);o.classList.remove("show");adBusy=false;t.cat=queue.shift();t.locked=false;pull();render();settle()}},1000)}
$("boxrow").addEventListener("click",ev=>{const b=ev.target.closest(".rv");if(!b||over)return;watchAd([...$("boxrow").children].indexOf(b.closest(".bx")))});
$("board").addEventListener("pointerdown",ev=>{const b=ev.target.closest(".it");if(b){ev.preventDefault();tap(b)}});
$("re").onclick=$("again").onclick=init;
function fit(){const s=Math.min(innerWidth/450,innerHeight/800);$("stage").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();
init();
</script></body></html>
